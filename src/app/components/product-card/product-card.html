<article class="card">
  @if (product().imageUrl) {
    <img [src]="product().imageUrl" [alt]="product().name" />
  } @else {
    <div class="placeholder">No image</div>
  }

  <p class="category">{{ product().category.name }}</p>
  <h3>{{ product().name }}</h3>

  @if (product().specs) {
    <p class="specs">{{ product().specs }}</p>
  }

  <p class="price">{{ product().price | currency:'KES':'code':'1.0-0' }}</p>

  @if (product().inStock) {
    <p class="stock in">In stock</p>
  } @else {
    <p class="stock out">Out of stock</p>
  }
</article>
